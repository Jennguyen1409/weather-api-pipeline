name: Validate Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: List files
      run: ls -la
    
    - name: Check if script exists
      run: |
        if [ -f "scripts/api_weather_pipeline.py" ]; then
          echo "✅ File exists"
        else
          echo "❌ File not found: scripts/api_weather_pipeline.py"
          exit 1
        fi
